services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brickandbeam
      POSTGRES_PASSWORD: brickandbeam
      POSTGRES_DB: brickandbeam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickandbeam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
