name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      AUTH_SECRET: "ci-placeholder"
      # Used only by the Playwright smoke test (see playwright.config.ts).
      TEST_DATABASE_URL: "postgresql://brickandbeam:brickandbeam@localhost:5432/brickandbeam_test"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brickandbeam
          POSTGRES_PASSWORD: brickandbeam
          POSTGRES_DB: brickandbeam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brickandbeam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
